name: NEAS Content Platform CI

on:
  push:
    branches:
      - codex/repo-health-2026-11-21
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neas-content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript checks
        run: pnpm run check
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
